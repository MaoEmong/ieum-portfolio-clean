name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.12.2'
      - name: Install document check dependency
        run: python -m pip install -r scripts/check-requirements.txt
      - name: Test disclosure guard
        run: python -m unittest discover -s scripts/tests
      - name: Check curated files and history
        run: python scripts/check_disclosure.py --history
      - name: Verify PDF structure
        run: python scripts/verify_pdf.py
      - name: Resolve example packages
        working-directory: examples/reliability
        run: dart pub get --enforce-lockfile
      - name: Format
        working-directory: examples/reliability
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: examples/reliability
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: examples/reliability
        run: dart test
      - name: Run example
        working-directory: examples/reliability
        run: dart run example/main.dart
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify backend contracts
        working-directory: examples/backend-boundaries
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Detect deliberate defects and recheck normal contracts
        working-directory: examples/backend-boundaries
        run: python scripts/red_green.py
